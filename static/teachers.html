<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление учителями</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .hint { color: #555; font-size: 0.9em; margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 0.9em; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f3f4f6; }
    input, select { padding: 8px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
    input[type=text] { width: 100%; }
    button { cursor: pointer; padding: 8px 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; }
    button.primary { background: #2563eb; color: #fff; border: 0; }
    button.danger { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
    .login-box { max-width: 420px; margin: 40px auto; padding: 24px; border: 1px solid #ccc; border-radius: 12px; }
    .login-box input { width: 100%; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr auto; gap: 12px; align-items: end; margin-bottom: 16px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; }
    .ok { color: #047857; font-weight: 600; }
    .err { color: #b91c1c; font-weight: 600; }
    .nav { margin-bottom: 20px; }
    .nav a { margin-right: 16px; text-decoration: none; color: #2563eb; }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h1>Управление учителями</h1>
  <p class="hint">Введите пароль администратора.</p>
  <input type="password" id="pwd" placeholder="Пароль">
  <button class="primary" onclick="login()">Войти</button>
  <p id="loginMsg"></p>
</div>

<div id="appScreen" style="display:none">
  <div class="nav">
    <a href="/static/index.html">← На главную</a>
    <a href="/static/admin.html">Оценка администратора</a>
    <a href="/static/summary.html">Сводная таблица</a>
  </div>

  <h1>Справочник учителей</h1>
  <p class="hint">Добавляйте учителей, чтобы они появились в выпадающих списках на формах. Удаление скрывает учителя из форм, но не удаляет его оценки из базы.</p>

  <div class="form-row">
    <div>
      <label>ФИО (полностью) *</label>
      <input type="text" id="newFio" placeholder="Иванов Иван Иванович">
    </div>
    <div>
      <label>Статус</label>
      <select id="newStatus">
        <option value="teacher">Учитель</option>
        <option value="admin">Администратор</option>
      </select>
    </div>
    <div>
      <label>Активен</label>
      <select id="newActive">
        <option value="1">Да</option>
        <option value="0">Нет</option>
      </select>
    </div>
    <div>
      <label>Примечание</label>
      <input type="text" id="newNote" placeholder="Необязательно">
    </div>
    <div>
      <button class="primary" onclick="addTeacher()">Добавить</button>
    </div>
  </div>
  <p id="msg"></p>

  <table id="tbl"></table>
</div>

<script>
let password = '';

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function headers() {
  return { 'Content-Type': 'application/json', 'X-Admin-Password': password };
}

async function login() {
  password = document.getElementById('pwd').value.trim();
  const r = await fetch('/api/teachers?active_only=false', { headers: headers() });
  if (!r.ok) {
    document.getElementById('loginMsg').innerHTML = '<span class="err">Неверный пароль</span>';
    password = '';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  await loadTeachers();
}

async function loadTeachers() {
  const r = await fetch('/api/teachers?active_only=false');
  const list = await r.json();
  render(list);
}

function render(list) {
  if (!list.length) {
    document.getElementById('tbl').innerHTML = '<tr><td>Список пуст</td></tr>';
    return;
  }
  let h = '<thead><tr><th>ФИО</th><th>Статус</th><th>Активен</th><th>Примечание</th><th>Действие</th></tr></thead><tbody>';
  list.forEach(t => {
    h += `<tr>
      <td>${esc(t.fio)}</td>
      <td>${t.status === 'teacher' ? 'Учитель' : 'Администратор'}</td>
      <td>${t.active ? 'Да' : 'Нет'}</td>
      <td>${esc(t.note || '')}</td>
      <td><button class="danger" onclick="delTeacher('${esc(t.fio).replace(/'/g, "\\'")}')">Удалить</button></td>
    </tr>`;
  });
  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

async function addTeacher() {
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = 'Добавление...';

  const fio = document.getElementById('newFio').value.trim();
  if (!fio) {
    msg.className = 'err'; msg.textContent = 'Введите ФИО';
    return;
  }

  const payload = {
    fio,
    status: document.getElementById('newStatus').value,
    active: Number(document.getElementById('newActive').value),
    note: document.getElementById('newNote').value.trim()
  };

  const r = await fetch('/api/teachers', {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify(payload)
  });

  if (!r.ok) {
    const err = await r.json().catch(()=>({}));
    msg.className = 'err';
    msg.textContent = err.detail || 'Ошибка добавления';
    return;
  }

  msg.className = 'ok'; msg.textContent = 'Учитель добавлен';
  document.getElementById('newFio').value = '';
  document.getElementById('newNote').value = '';
  await loadTeachers();
}

async function delTeacher(fio) {
  if (!confirm(`Удалить запись "${fio}"?`)) return;
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = 'Удаление...';

  const r = await fetch(`/api/teachers/${encodeURIComponent(fio)}`, {
    method: 'DELETE',
    headers: headers()
  });

  if (!r.ok) {
    msg.className = 'err'; msg.textContent = 'Ошибка удаления';
    return;
  }
  msg.className = 'ok'; msg.textContent = 'Удалено';
  await loadTeachers();
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
